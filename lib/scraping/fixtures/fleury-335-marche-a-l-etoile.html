<meta property="og:description" content="Un film de Boris Wilmart TOUT PUBLIC • 75 MIN Télescopes et caméras sur le dos, l’astronome Stephen Rater et le réalisateur Boris Wilmart se lancent dans une traversée du continent sud-américain, pour en observer les cieux étoilés. Un voyage sidéral qui débute sur les hauteurs du désert d’Atacama, au pied du plus puissant radiotélescope au monde (ALMA) et qui les mènera jusqu’au centre spatial de Kourou, en Guyane française, pour assister au décollage de la fusée Ariane. En chemin, Stephen et Boris inviteront les habitants à contempler les étoiles et à questionner le rapport qu’ils entretiennent au cosmos">
